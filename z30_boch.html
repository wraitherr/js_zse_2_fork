<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obiekt Dom</title>
</head>
<body>
    <script>
        function Dom(_ilu_dlugosc, _kolor, _styl) {
            this.ilu_dlugosc = _ilu_dlugosc;
            this.kolor = _kolor;
            this.styl = _styl;

            this.dom_wyswietl_bochkovskyi = function() {
                document.write(
                    `Dom w stylu ${this.styl} ma kolor scian ${this.kolor} i ma dlugosc ${this.ilu_dlugosc} m.`
                );
            }
        }

        let dom1 = new Dom(50, "bialy", "High Tech");
        dom1.dom_wyswietl_bochkovskyi();
    </script>
</body>
</html>
