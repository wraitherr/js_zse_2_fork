<body>
<script language="JavaScript">
var R_boch = parseFloat(prompt("Podaj promień koła R:", ""));
var N_boch = 0;
var R_int_boch = Math.floor(R_boch);
for(i_boch = Math.floor(-R_boch-1); i_boch <= Math.floor(R_boch+1); i_boch++)
{
for(j_boch = Math.floor(-R_boch-1); j_boch <= Math.floor(R_boch+1); j_boch++)
{
if(i_boch*i_boch + j_boch*j_boch <= R_boch*R_boch)
{
N_boch++;
}
}
}
document.write("Promień koła R = " + R_boch + "<br>");
document.write("Liczba punktów kratowych N(R) = " + N_boch + "<br>");
</script>
